apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-on-eks
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
%{ if enable_tiered_storage ~}
    image: ${custom_image_url}
%{ endif ~}
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodeAddressType: InternalIP
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
%{ if enable_tiered_storage ~}
      remote.log.storage.system.enable: "true"
      remote.log.manager.task.interval.ms: "5000"
      log.retention.check.interval.ms: "10000"
%{ endif ~}
    resources:
      requests:
        memory: 58Gi
        cpu: "6"
      limits:
        memory: 64Gi
        cpu: "8"
    jvmOptions:
      "-Xmx": "6g"
      "-Xms": "4g"
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 1000Gi
          class: gp3
          deleteClaim: false
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: NodeGroupType
                      operator: In
                      values:
                        - kafka
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                - key: "strimzi.io/pool-name"
                  operator: In
                  values:
                  - mixed
              topologyKey: "kubernetes.io/hostname"
%{ if enable_tiered_storage ~}
    tieredStorage:
      type: custom
      remoteStorageManager:
        className: io.aiven.kafka.tieredstorage.RemoteStorageManager
        classPath: /opt/kafka/tiered-storage-s3/*
        config:
          storage.backend.class: io.aiven.kafka.tieredstorage.storage.s3.S3Storage
          storage.s3.bucket.name: "${tiered_storage_bucket_name}"
          storage.s3.region: "${region}"
          chunk.size: "4194304"
%{ endif ~}
%{ if enable_monitoring }
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
%{ endif }
    rack:
      topologyKey: topology.kubernetes.io/zone
%{ if enable_monitoring }
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
%{ endif }